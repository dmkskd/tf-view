[package]
name = "tfview"
version = "0.1.0"
edition = "2021"
description = "Render a Terraform plan as an AWS architecture diagram"
license = "Apache-2.0"

[dependencies]
clap = { version = "4", features = ["derive", "env"] }
opener = "0.7"
tempfile = "3"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
genai = "0.2"


