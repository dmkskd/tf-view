# Local Atlantis demo: GitLab CE + Atlantis + Floci (AWS emulator) + nginx for the HTML reports.
#   just up      -> everything, including GitLab project/token/webhook setup (see setup/setup.sh)
#   just mr-create -> opens a merge request; Atlantis autoplans it
#
# setup, atlantis and demo share GitLab's network namespace (network_mode: service:gitlab), so
# "localhost" is the same GitLab from the browser and from those containers: no DNS or /etc/hosts tricks.
# Consequence: Atlantis' port 4141 is published on the gitlab service, and recreating gitlab means
# recreating the others too (`docker compose up -d --force-recreate`).
name: atlantis   # keep the project name (and so the volumes) now that this file lives in gitlab/
services:
  gitlab:
    image: gitlab/gitlab-ce:latest
    hostname: gitlab
    environment:
      GITLAB_OMNIBUS_CONFIG: |
        external_url 'http://localhost:8929'
        gitlab_rails['initial_root_password'] = 'demo-password-123'
        gitlab_rails['gitlab_shell_ssh_port'] = 2224
        prometheus_monitoring['enable'] = false
    ports:
      - "8929:8929"   # GitLab
      - "4141:4141"   # Atlantis (shares this network namespace)
    volumes:
      - gitlab-config:/etc/gitlab
      - gitlab-data:/var/opt/gitlab
    shm_size: 512m
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8929/-/readiness"]
      interval: 15s
      timeout: 10s
      retries: 80
      start_period: 120s

  floci:
    image: floci/floci:latest
    ports:
      - "4566:4566"

  # One-shot: creates the root token, project, webhook and initial commit, then exits.
  setup:
    build: { context: .., dockerfile: gitlab/setup/Dockerfile }
    network_mode: "service:gitlab"
    depends_on:
      gitlab: { condition: service_healthy }
    environment:
      COMPOSE_PROJECT: ${COMPOSE_PROJECT_NAME:-atlantis}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock   # to run gitlab-rails inside the gitlab container
      - shared:/shared
      - ../shared/infra:/seed/infra:ro
      - ../shared/atlantis.yaml:/seed/atlantis.yaml:ro

  # One-shot: applies the base stack (the network) to Floci, once, so the MR's plan shows only what it adds.
  # Skipped when Floci's state already has resources (e.g. after an MR was applied).
  base:
    image: hashicorp/terraform:1.9
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        rm -rf /work
        mkdir /work
        cp /seed/main.tf /work
        cd /work
        terraform init -input=false >/dev/null
        if [ -z "$$(terraform state list)" ]; then terraform apply -auto-approve -input=false; else echo "state not empty, base left as is"; fi
    depends_on:
      setup: { condition: service_completed_successfully }
      floci: { condition: service_started }
    volumes:
      - ../shared/infra:/seed:ro

  atlantis:
    build:
      context: ..
      dockerfile: gitlab/atlantis/Dockerfile
      args: { PLAN_IMAGE: "on" }   # "off" skips Chromium: comments get the link only
    network_mode: "service:gitlab"
    depends_on:
      base: { condition: service_completed_successfully }
    # Token and webhook secret are generated by setup and handed over through the shared volume.
    entrypoint: ["/bin/sh", "-c", ". /shared/atlantis.env && exec docker-entrypoint.sh server"]
    environment:
      ATLANTIS_GITLAB_HOSTNAME: http://localhost:8929
      ATLANTIS_GITLAB_USER: root
      ATLANTIS_REPO_ALLOWLIST: "*"
      ATLANTIS_ATLANTIS_URL: http://localhost:4141
      ATLANTIS_REPO_CONFIG: /etc/atlantis/repos.yaml
      ATLANTIS_PORT: "4141"
      PLAN_IMAGE: "on"
      REPORTS_URL: http://127.0.0.1:8080   # not localhost: GitLab only opens links to other hosts in a new tab
    volumes:
      - shared:/shared:ro
      - ./atlantis/repos.yaml:/etc/atlantis/repos.yaml:ro
      - ../../../dist/index.html:/opt/tfplanview/index.html:ro   # `just build` first (just up does it)
      - ./reports:/reports

  reports:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./reports:/usr/share/nginx/html:ro
      - ./reports.conf:/etc/nginx/conf.d/default.conf:ro

  # One-shot demo.sh runs for the `just mr-*` recipes (profile: only runs on request).
  demo:
    build: { context: .., dockerfile: gitlab/setup/Dockerfile }
    profiles: [demo]
    network_mode: "service:gitlab"
    entrypoint: ["/demo.sh"]
    volumes:
      - shared:/shared:ro

  # `just drift` (profile: only runs on request). Someone edits a subnet's tag by hand, outside Terraform.
  drift:
    image: amazon/aws-cli
    profiles: [demo]
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        id=$$(aws ec2 describe-subnets --filters Name=cidr-block,Values=10.0.1.0/24 --query "Subnets[0].SubnetId" --output text)
        aws ec2 create-tags --resources "$$id" --tags Key=Name,Value=hand-edited
        echo "Edited subnet $$id by hand: Name = hand-edited. The next plan reports it as drift and puts it back."
    environment:
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_DEFAULT_REGION: us-east-1
      AWS_ENDPOINT_URL: http://floci:4566

volumes:
  gitlab-config:
  gitlab-data:
  shared:
